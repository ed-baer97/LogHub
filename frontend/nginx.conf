limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream loghub_api {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=10s;
    server backend-2:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    gzip on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    location /api/tracking/stream {
        gzip off;
        proxy_pass http://loghub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://loghub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
